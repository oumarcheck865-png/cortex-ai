<svg width="47" height="30" viewBox="0 0 148 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cortex AI wordmark logo: stylized neural cortex node -->
  <defs>
    <linearGradient id="cortex-grad" x1="0" y1="0" x2="148" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- central cortex node -->
  <circle cx="74" cy="50" r="20" fill="url(#cortex-grad)"/>
  <!-- orbiting nodes -->
  <circle cx="30" cy="30" r="8" fill="url(#cortex-grad)"/>
  <circle cx="118" cy="30" r="8" fill="url(#cortex-grad)"/>
  <circle cx="30" cy="70" r="8" fill="url(#cortex-grad)"/>
  <circle cx="118" cy="70" r="8" fill="url(#cortex-grad)"/>
  <!-- synapses -->
  <path d="M30 30 L74 50 L118 30 M30 70 L74 50 L118 70" stroke="url(#cortex-grad)" stroke-width="3" stroke-linecap="round"/>
</svg>
