name: CI

on:
  push:
    branches: [main, feat/cortex-platform-bootstrap]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  landing:
    name: Landing (Next.js) — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  app:
    name: App (OpenHands runtime) — Cortex build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Cortex AI SPA (base path /app)
        env:
          VITE_BASE_PATH: /app
          VITE_MOCK_API: "false"
        run: npm run build:app

      - name: Inject Cortex auth guard
        run: node scripts/cortex-postbuild.mjs

      - name: Verify build output
        run: |
          test -f build/index.html
          grep -q "cortex-ai.session" build/index.html
          grep -q "Cortex AI" build/index.html

  security:
    name: Security — secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
